```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DIVEX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <form id="loginForm" class="form-box">

        <h1 class="logo">DIVEX</h1>
        <h2>Welcome Back!</h2>
        <p>Login to your DIVEX account</p>

        <input
            type="text"
            id="loginIdentifier"
            placeholder="Username or Email"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

        <p id="loginMessage"></p>

        <div class="link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </form>
</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const identifier = document.getElementById("loginIdentifier").value.trim();
    const password = document.getElementById("loginPassword").value;

    loginMessage.textContent = "Logging in...";

    try {

        const response = await fetch("http://localhost:4001/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                identifier: identifier,
                password: password
            })

        });

        const data = await response.json();

        if (!response.ok) {

            loginMessage.textContent =
                data.message || "Incorrect username or password!";

            return;
        }

        // Save token
        localStorage.setItem("divexToken", data.token);

        // Save user information
        localStorage.setItem("divexUser", JSON.stringify(data.user));

        loginMessage.textContent = "Login successful!";

        // Redirect to dashboard
        window.location.href = "dashboard.html";

    } catch (error) {

        console.error("Login error:", error);

        loginMessage.textContent =
            "Cannot connect to DIVEX server. Please try again.";

    }

});

</script>

</body>
</html>
