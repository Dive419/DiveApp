```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DIVEX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <form id="registerForm" class="form-box">

        <h1 class="logo">DIVEX</h1>
        <h2>Create Account</h2>
        <p>Join the DIVEX community</p>

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="regEmail"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            id="phoneNumber"
            placeholder="Phone Number"
            required
        >

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
            minlength="3"
        >

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <input
            type="password"
            id="regPassword"
            placeholder="Password (minimum 8 characters)"
            required
            minlength="8"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">Create Account</button>

        <p id="registerMessage"></p>

        <div class="link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </form>
</div>

<script>
const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const phoneNumber = document.getElementById("phoneNumber").value.trim();
    const username = document.getElementById("username").value.trim();
    const gender = document.getElementById("gender").value;

    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Check passwords
    if (password !== confirmPassword) {
        registerMessage.textContent = "Passwords do not match!";
        return;
    }

    if (password.length < 8) {
        registerMessage.textContent =
            "Password must contain at least 8 characters!";
        return;
    }

    registerMessage.textContent = "Creating your account...";

    try {

        const response = await fetch("http://localhost:4001/api/register", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                full_name: fullName,
                email: email,
                phone_number: phoneNumber,
                username: username,
                password: password,
                gender: gender
            })
        });

        const data = await response.json();

        if (!response.ok) {
            registerMessage.textContent =
                data.message || "Registration failed!";
            return;
        }

        registerMessage.textContent =
            "Account created successfully! Redirecting to login...";

        registerForm.reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        console.error("Registration error:", error);

        registerMessage.textContent =
            "Cannot connect to DIVEX server. Please try again.";
    }

});
</script>

</body>
</html>
```
